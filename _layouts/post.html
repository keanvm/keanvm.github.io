layout: default
---

<!-- {% include header.html %} -->

<div class="content post">
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.date %}
  <div class="post-date">
    <time>{{ page.date | date_to_string }}</time>
  </div>
  {% endif %}
  {{ content }}
</div>
<div style="height: 250px">
</div>
{% if site.disqus_shortname %}
  {% include disqus_comments.html %}
{% endif %}
